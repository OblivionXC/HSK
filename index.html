<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c"><title>DicoChinois</title>
<style>
:root{--bg:#0a0a0c;--card:#16161a;--line:#26262c;--tx:#f4f4f6;--mu:#9a9aa5;--red:#c8102e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;margin:0}h1 span{color:var(--red)}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.lg{border:2px solid var(--red);color:var(--red);border-radius:6px;padding:2px 6px;line-height:1.1;font-size:22px;text-align:center}
.sub{color:var(--mu);font-size:14px}
input[type=search]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:14px 18px;color:var(--tx);font-size:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile,.row,.box{background:var(--card);border:1px solid var(--line);border-radius:16px}
.tile{padding:22px 10px;text-align:center;font-size:17px;font-weight:600;cursor:pointer;color:var(--tx)}
.tile i{display:block;font-style:normal;font-size:26px;margin-bottom:6px}
.wod{border-left:4px solid var(--red);background:linear-gradient(90deg,#2a0a12,var(--card));border-radius:16px;padding:16px;cursor:pointer;margin-bottom:14px}
.wod b{display:block;font-size:34px;margin:4px 0}
.row{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:10px;cursor:pointer}
.row .h{color:var(--red);font-size:30px;min-width:70px}
.row .p{font-weight:600}.row .f{color:var(--mu);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h2{font-size:18px;margin:0}
.ib{background:none;border:0;color:var(--tx);font-size:26px;cursor:pointer;padding:4px 10px}
.big{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.cbox{position:relative;width:170px;height:170px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:76px;white-space:nowrap}
.cbox.s{font-size:54px}
.badge{position:absolute;top:-10px;left:50%;background:var(--red);border-radius:14px;padding:3px 12px;font-size:14px}
.py{font-size:28px}.spk{background:var(--red);border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer;margin-left:8px}
h3{border-left:4px solid var(--red);padding-left:10px;margin:20px 0 10px;font-size:18px}
.btn{display:block;width:100%;padding:16px;border-radius:30px;border:1px solid var(--line);background:none;color:var(--tx);font-size:17px;margin-bottom:10px;cursor:pointer}
.btn.r{background:linear-gradient(#c8102e,#a50d26);border:0;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;color:var(--tx);cursor:pointer}
.chip.on{border-color:var(--red);color:var(--red)}
canvas{width:100%;max-width:340px;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:18px;touch-action:none;display:block;margin:0 auto 14px}
.opt{display:block;width:100%;text-align:left;padding:16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--tx);font-size:16px;cursor:pointer}
.opt.ok{border-color:#2e9e5b;background:#10261a}.opt.no{border-color:var(--red);background:#2a0a12}
.card{text-align:center;padding:40px 16px;font-size:70px;margin-bottom:14px}.card small{display:block;font-size:20px;color:var(--mu);margin-top:10px}
.bar{height:8px;background:var(--line);border-radius:4px;margin:6px 0 14px;overflow:hidden}.bar div{height:100%;background:var(--red)}
.box{padding:16px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0d0d10;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font-size:12px;cursor:pointer}
nav button.on{color:var(--red)}nav button i{display:block;font-style:normal;font-size:22px}
.mu{color:var(--mu)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media print{:root{--bg:#fff;--card:#fff;--line:#bbb;--tx:#000;--mu:#444}body{background:#fff;color:#000}nav,.noprint,.top button,.spk{display:none}svg text{stroke:#fff !important}}
</style>
</head>

 if(V==="home"){const wd=W[new Date().getDate()%W.length];
  A.innerHTML=`<div class="logo"><div class="lg">中<br>文</div><div><h1>Dico<span>Chinois</span></h1><div class="sub">Apprendre · Comprendre · Réussir</div></div></div>
  <input type="search" id="s" placeholder="Français, 中文 ou pinyin…" value="${q}" autocomplete="off"><div id="tr"></div><div id="res"></div>
  <div id="tiles"><div class="grid">
  <div class="tile" onclick="go('dict')"><i>📖</i>Dictionnaire</div><div class="tile" onclick="go('hsk')"><i>🎓</i>HSK</div>
  <div class="tile" onclick="startQuiz()"><i>✏️</i>Exercices</div><div class="tile" onclick="startRev()"><i>↻</i>Réviser</div>
  <div class="tile" onclick="go('fav')"><i>☆</i>Favoris</div><div class="tile" onclick="go('hist')"><i>🕘</i>Historique</div></div>
  <div class="wod" onclick="open_(${wd.id})"><span class="mu">Mot du jour</span><b>${wd.h}</b><span class="mu">${wd.p} · ${wd.f}</span></div></div>`;
  
  const s=$("#s");
  let searchTimer;
  const upd=()=>{
    q=s.value;
    const term=q.trim();
    const r=term?find(term):null;
    
    if(!r){
      $("#res").innerHTML="";
      $("#tiles").style.display="";
      return;
    }
    
    $("#tiles").style.display="none";
    if(r.length>0){
      $("#res").innerHTML=r.map(rowH).join("");
    }else{
      $("#res").innerHTML='<p class="mu">Recherche en ligne...</p>';
      clearTimeout(searchTimer);
      searchTimer=setTimeout(async()=>{
        try{
          const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(term)}&langpair=fr|zh-CN`);
          const data=await res.json();
          if(data&&data.responseData&&data.responseData.translatedText&&s.value.trim()===term){
            const trText=data.responseData.translatedText;
            // Appel secondaire pour récupérer une estimation du Pinyin via l'API MyMemory (traduction inverse vers l'anglais/pinyin ou affichage structuré)
            $("#res").innerHTML=`
              <div class="box">
                <div class="mu">Résultat en ligne (Traduction)</div>
                <div style="font-size:30px;color:var(--red);margin:6px 0"><b>${esc(trText)}</b></div>
                <div class="f">Recherche : "${esc(term)}"</div>
                <button class="chip" style="margin-top:10px" onclick="speak(this.dataset.z)" data-z="${esc(trText)}">🔊 Écouter</button>
              </div>`;
          }else if(s.value.trim()===term){
            $("#res").innerHTML='<p class="mu">Aucun résultat.</p>';
          }
        }catch(e){
          if(s.value.trim()===term)$("#res").innerHTML='<p class="mu">Aucun résultat.</p>';
        }
      },500);
    }
  };
  s.oninput=()=>{upd();trans(s.value)};upd();

 }else if(V==="dict"||V==="hsk"){
  const L=[0,1,2,3,4,5,6];const list=W.filter(w=>!lvl||w.l===lvl).sort((a,b)=>a.l-b.l);
  A.innerHTML=`<div class="top"><h2>${V==="hsk"?"Niveaux HSK":"Dictionnaire"}</h2></div><input type="search" id="ds" placeholder="Tape un mot en français, 中文 ou pinyin…" value="${q}" autocomplete="off"><div class="chips">${L.map(x=>`<button class="chip ${x===lvl?"on":""}" onclick="lvl=${x};render()">${x?"HSK "+x:"Tous"}</button>`).join("")}</div><div id="tr"></div><div id="dl"></div>`;
  
  const ds=$("#ds");
  let dictSearchTimer;
  const dl=()=>{
    q=ds.value;
    const term=q.trim();
    const r=term?find(term).filter(w=>!lvl||w.l===lvl):list;
    
    if(r.length>0){
      $("#dl").innerHTML=r.map(rowH).join("");
    }else{
      $("#dl").innerHTML='<p class="mu">Recherche en ligne...</p>';
      clearTimeout(dictSearchTimer);
      dictSearchTimer=setTimeout(async()=>{
        try{
          const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(term)}&langpair=fr|zh-CN`);
          const data=await res.json();
          if(data&&data.responseData&&data.responseData.translatedText&&ds.value.trim()===term){
            const trText=data.responseData.translatedText;
            $("#dl").innerHTML=`
              <div class="box">
                <div class="mu">Résultat en ligne (Traduction)</div>
                <div style="font-size:30px;color:var(--red);margin:6px 0"><b>${esc(trText)}</b></div>
                <div class="f">Recherche : "${esc(term)}"</div>
                <button class="chip" style="margin-top:10px" onclick="speak(this.dataset.z)" data-z="${esc(trText)}">🔊 Écouter</button>
              </div>`;
          }else if(ds.value.trim()===term){
            $("#dl").innerHTML='<p class="mu">Aucun résultat.</p>';
          }
        }catch(e){
          if(ds.value.trim()===term)$("#dl").innerHTML='<p class="mu">Aucun résultat.</p>';
        }
      },500);
    }
  };
  ds.oninput=()=>{dl();trans(ds.value)};dl();

 }else if(V==="detail"){const w=cur,isF=fav.includes(w.id);
  const parts=[...w.h].length>1?[...w.h].map(c=>W.find(x=>x.h===c)).filter(Boolean):[];
  const rel=W.filter(x=>x.id!==w.id&&(x.h.includes(w.h)||(w.h.length>1&&w.h.includes(x.h)&&x.h.length===1)));
  A.innerHTML=`<div class="top"><button class="ib" onclick="go('${back}')">‹</button><h2>Détail du caractère</h2><button class="ib" onclick="tog(${w.id})">${isF?"★":"☆"}</button></div>
  <div class="big"><div class="cbox ${w.h.length>2?"s":""}"><span class="badge">HSK ${w.l}</span>${w.h}</div><div><span class="py">${w.p}</span><button class="spk" onclick="speak('${w.h}')">🔊</button><div style="margin-top:10px;font-size:20px">${w.f.split(" (")[0]}</div></div></div>
  ${parts.length?`<div class="chips">${parts.map(x=>`<button class="chip" onclick="open_(${x.id})" style="font-size:24px">${x.h}</button>`).join("")}</div>`:""}
  <h3>Façons d’écrire</h3><div class="box"><div>简体 Simplifié : <b style="font-size:26px">${w.h}</b></div><div style="margin-top:8px">繁體 Traditionnel : <b style="font-size:26px">${w.t}</b></div><div style="margin-top:8px">Pinyin : <b>${w.p}</b> <span class="mu">(sans tons : ${norm(w.p)})</span></div></div><h3>Définition</h3><p><b>${w.p}</b> — ${w.f}</p>
  ${rel.length?`<h3>Mots liés</h3>${rel.map(rowH).join("")}`:""}
  <button class="btn r" onclick="speak('${w.h}')">▶️ Écouter la prononciation</button>
  <h3>Comment l’écrire</h3><div id="sg"><div class="box mu">Chargement des traits…</div></div><div class="box"><b>Règles d’écriture</b><ul class="mu" style="margin:8px 0 0;padding-left:20px;line-height:1.6"><li>De haut en bas, puis de gauche à droite.</li><li>Le trait horizontal avant le vertical quand ils se croisent.</li><li>Le trait qui descend à gauche (丿) avant celui qui descend à droite (乀).</li><li>Le milieu avant les côtés (ex. 小).</li><li>On entre avant de fermer : cadre, contenu, puis le trait du bas (ex. 日).</li><li>Les petits points et traits de fermeture se font en dernier.</li></ul></div><button class="btn noprint" onclick="window.print()">🖨️ Imprimer la fiche</button>`;
  strokeGuide();
 }else if(V==="quiz"){
  if(!qs)qs=newQ();const w=qs.w;
  A.innerHTML=`${head("Exercices","home")}<div class="mu">Score : ${stat.qok} / ${stat.qn}</div><div class="card box">${w.h}<small>Quel est le sens ?</small></div>${qs.o.map((o,i)=>`<button class="opt" onclick="ans(${i})">${o.f.split(" (")[0]}</button>`).join("")}<div id="nx"></div>`;
 }else if(V==="rev"){
  if(!fc)fc={w:rnd(W),s:false};
  A.innerHTML=`${head("Réviser","home")}<div class="box card" onclick="fc.s=true;render()">${fc.w.h}<small>${fc.s?fc.w.p+" · "+fc.w.f.split(" (")[0]:"Touchez pour voir la réponse"}</small></div>
  ${fc.s?`<div style="display:flex;gap:10px"><button class="btn" onclick="rv(0)">À revoir</button><button class="btn r" onclick="rv(1)">Je sais</button></div><button class="btn" onclick="speak('${fc.w.h}')">🔊 Écouter</button>`:""}<p class="mu">Mots maîtrisés : ${known.length} / ${W.length}</p>`;
 }else if(V==="fav"||V==="hist"){
  const L=(V==="fav"?fav:hist).map(i=>W[i]);
  A.innerHTML=`${head(V==="fav"?"Favoris":"Historique","home")}${L.map(rowH).join("")||'<p class="mu">Rien ici pour le moment.</p>'}`;
 }else if(V==="prog"){
  const seen=new Set(hist);const pc=stat.qn?Math.round(100*stat.qok/stat.qn):0;
  A.innerHTML=`<div class="top"><h2>Progrès</h2></div>
  <div class="box"><b>Mots consultés</b> : ${seen.size} / ${W.length}<div class="bar"><div style="width:${100*seen.size/W.length}%"></div></div>
  <b>Mots maîtrisés</b> : ${known.length} / ${W.length}<div class="bar"><div style="width:${100*known.length/W.length}%"></div></div>
  <b>Réussite aux exercices</b> : ${pc}% (${stat.qok}/${stat.qn})<div class="bar"><div style="width:${pc}%"></div></div>
  <b>Favoris</b> : ${fav.length}</div>`;
 }else{
  A.innerHTML=`<div class="top"><h2>Profil</h2></div><div class="box"><b>DicoChinois</b><p class="mu">Dictionnaire et outil d’apprentissage du chinois : caractères, pinyin, prononciation, HSK, exercices et écriture.</p></div><button class="btn" onclick="if(confirm('Effacer toute ta progression ?')){fav=[];hist=[];known=[];stat={qok:0,qn:0,wr:0};['fav','hist','known','stat'].forEach(k=>ST.set(k,null));render()}">Réinitialiser ma progression</button>`;
 }
}

let tTimer,tCtl,tLast="";
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function trans(t){
 clearTimeout(tTimer);if(tCtl)tCtl.abort();const box=$("#tr");if(!box)return;
 t=t.trim();tLast=t;
 if(t.split(/\s+/).length<2||/[\u4e00-\u9fff]/.test(t)){box.innerHTML="";return}
 box.innerHTML='<div class="box mu">Traduction en cours…</div>';
 tTimer=setTimeout(async()=>{
  try{
   tCtl=new AbortController();
   const res=waitRes=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=fr|zh-CN`,{signal:tCtl.signal});
   const data=await res.json();
   if(data&&data.responseData&&data.responseData.translatedText){
    const translated=data.responseData.translatedText;
    if(tLast===t&&box.isConnected){
     box.innerHTML=`<div class="box"><div class="mu">Traduction de phrase</div><div style="font-size:26px;margin:6px 0">${esc(translated)}</div><button class="chip" onclick="speak(this.dataset.z)" data-z="${esc(translated)}">🔊 Écouter</button></div>`;
    }
   }else{
    if(tLast===t&&box.isConnected)box.innerHTML='<div class="box mu">Impossible de traduire pour le moment.</div>';
   }
  }catch(e){if(tLast!==t||(e&&e.name==="AbortError"))return;box.innerHTML='<div class="box mu">Impossible de traduire pour le moment.</div>'}
 },700)
}

const hwData={};
async function getData(c){
 if(hwData[c]!==undefined)return hwData[c];
 for(const v of ["2.0.1","2.0","latest"]){try{const r=await fetch("https://cdn.jsdelivr.net/npm/hanzi-writer-data@"+v+"/"+encodeURIComponent(c)+".json");if(r.ok)return hwData[c]=await r.json()}catch(e){}}
 return hwData[c]=null
}
const GRID='<path d="M0 0L1024 1024M1024 0L0 1024M512 0V1024M0 512H1024" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="14 14" stroke-width="6" fill="none"/>';
function svg(d,k,nums){
 let s='<svg viewBox="0 0 1024 1024" width="100%" style="display:block;color:var(--tx)"><rect x="4" y="4" width="1016" height="1016" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="8"/>'+GRID+'<g transform="scale(1,-1) translate(0,-900)">';
 d.strokes.forEach((p,i)=>{if(i<k)s+=`<path d="${p}" fill="${!nums&&i===k-1?"#e5173a":"currentColor"}" fill-opacity="${!nums&&i===k-1?1:.55}"/>`});
 s+="</g>";
 if(nums)d.medians.forEach((m,i)=>{s+=`<text x="${m[0][0]}" y="${900-m[0][1]}" font-size="100" font-weight="700" fill="#e5173a" text-anchor="middle" dominant-baseline="central" stroke="#0a0a0c" stroke-width="16" paint-order="stroke">${i+1}</text>`});
 return s+"</svg>"
}
async function strokeGuide(){
 const chars=[...cur.h],id=cur.id,ds=await Promise.all(chars.map(getData)),box=$("#sg");
 if(!box||V!=="detail"||cur.id!==id)return;
 if(ds.some(d=>!d)){box.innerHTML='<div class="box mu">Les schémas des traits se chargent depuis internet et ne sont pas disponibles ici. Les règles ci-dessous marchent partout.</div>';return}
 box.innerHTML=chars.map((c,ci)=>{const d=ds[ci],n=d.strokes.length;return `<div class="box"><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div style="width:130px;flex:none">${svg(d,n,true)}</div><div><b style="font-size:26px">${c}</b><div class="mu">${n} trait${n>1?"s":""} · suis l’ordre des numéros</div></div></div><div class="steps">${d.strokes.map((_,k)=>`<div>${svg(d,k+1,false)}<div class="mu" style="text-align:center;font-size:13px">Trait ${k+1}</div></div>`).join("")}</div></div>`}).join("")
}
function newQ(){const w=rnd(W);const o=[w];while(o.length<4){const x=rnd(W);if(!o.includes(x)&&x.f!==w.f)o.push(x)}return{w,o:o.sort(()=>Math.random()-.5),d:false}}
function startQuiz(){qs=null;go("quiz")}
function startRev(){fc=null;go("rev")}
function ans(i){if(qs.d)return;qs.d=true;const ok=qs.o[i]===qs.w;stat.qn++;if(ok)stat.qok++;ST.set("stat",stat);
 document.querySelectorAll(".opt").forEach((b,j)=>{if(qs.o[j]===qs.w)b.classList.add("ok");else if(j===i)b.classList.add("no")});
 $("#nx").innerHTML=`<p>${ok?"Bravo ! ✓":"Pas tout à fait."} <b>${qs.w.p}</b></p><button class="btn r" onclick="qs=null;render()">Suivant ›</button>`;speak(qs.w.h)}
function rv(k){const id=fc.w.id;known=k?[...new Set([...known,id])]:known.filter(x=>x!==id);ST.set("known",known);fc=null;render()}
render();
</script>
</body>
</html>
